name: 데일리 브리프 업데이트
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시
    - cron: "0 9 * * *"    # 매일 한국시간 오후 6시 (장 마감 뒤 공시 반영)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-brief
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node update.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add news.json disclosures.json
          git diff --staged --quiet || git commit -m "뉴스·공시 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
